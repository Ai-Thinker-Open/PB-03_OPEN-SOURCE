name: Repository validation

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  repository-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Validate projects, entry points, and documentation
        run: python tools/validate_repository.py

  tinycrypt-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Build and run the TinyCrypt test suite
        run: bash tools/validate_tinycrypt.sh
